description: Invalid contactId or Not Found
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: 'Contact with id=68147500491753c2edf939d4 not found'
    examples:
      invalidContactId:
        description: 'The **contactId** parameter is invalid.'
        summary: Invalid contactId
        value:
          status: 404
          message: '68147500491753c2edf939d4 not valid id'
      notFound:
        summary: Wrong not found id
        description: 'Wrong not found id'
        value:
          status: 404
          message: 'Contact with id=68147500491753c2edf939d4 not found'
